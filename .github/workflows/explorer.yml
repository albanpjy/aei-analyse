# Exploration des données réelles (schémas, facettes, variables) : exécutée par
# GitHub Actions parce que Hugging Face n'est pas accessible depuis le poste de
# développement. Les résultats sont versionnés dans docs/exploration/.
name: Exploration des données

on:
  workflow_dispatch:
  push:
    branches: [developpement]
    paths:
      - tools/explorer_schema.R
      - .github/workflows/explorer.yml

permissions:
  contents: write

jobs:
  explorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # binaires précompilés (Posit Package Manager)

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Installation minimale : on n'a pas besoin de tout renv.lock ici.
          dependencies: '"hard"'
          packages: |
            any::aieconindex
            any::duckdb
            any::DBI
            any::jsonlite
            any::tibble
            any::rlang

      - name: Inspecter les données
        run: Rscript tools/explorer_schema.R

      - name: Versionner le résultat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/exploration
          git commit -m "exploration : schémas réels des données AEI [skip ci]" || echo "Rien de nouveau"
          git push
