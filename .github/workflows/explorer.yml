# Exploration des données réelles (schémas, facettes, variables) : exécutée par
# GitHub Actions parce que Hugging Face n'est pas accessible depuis le poste de
# développement. Les résultats sont versionnés dans docs/exploration/.
name: Exploration des données

on:
  workflow_dispatch:
  push:
    branches: [developpement]
    paths:
      - tools/explorer_schema.py
      - .github/workflows/explorer.yml

permissions:
  contents: write

jobs:
  explorer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer duckdb (Python)
        run: pip install duckdb pandas

      - name: Inspecter les données
        run: python tools/explorer_schema.py

      - name: Versionner le résultat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/exploration
          git commit -m "exploration : schémas réels des données AEI [skip ci]" || echo "Rien de nouveau"
          git pull --rebase --autostash origin developpement
          git push origin HEAD:developpement
